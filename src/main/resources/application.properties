spring.profiles.active=dev
spring.application.name=apms-backend

# JWT
jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}

# Multipart file upload size limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# APMS Owner Organization Configuration
apms.owner.company-profile-id=${APMS_OWNER_COMPANY_PROFILE_ID:6a31a0000000000000000001}

# Firebase Cloud Messaging. Disabled by default so local development still starts without credentials.
app.firebase.enabled=${FIREBASE_ENABLED:false}
app.firebase.project-id=${FIREBASE_PROJECT_ID:}
app.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}

# Crawler Configuration
crawler.ai.provider=${AI_PROVIDER:gemini}
crawler.ai.gemini.api-key=${GEMINI_API_KEY:dummy-key}
crawler.ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
crawler.ai.summary.enabled=${AI_SUMMARY_ENABLED:true}
crawler.ai.summary.auto-enabled=${AI_SUMMARY_AUTO_ENABLED:false}
crawler.ai.summary.max-articles-per-run=${AI_SUMMARY_MAX_PER_RUN:20}
crawler.schedule.enabled=${CRAWLER_ENABLED:true}
crawler.schedule.cron=${CRAWLER_CRON:0 */5 * * * *}
crawler.startup.enabled=${CRAWLER_STARTUP_ENABLED:true}
crawler.seed.enabled=${CRAWLER_SEED_ENABLED:true}
crawler.company-cache.ttl-seconds=${CACHE_TTL:300}
crawler.content.fetch-delay-ms=${FETCH_DELAY:1000}
crawler.content.max-length=${MAX_CONTENT_LENGTH:5000}
crawler.feeds[0].name=CafeF
crawler.feeds[0].url=https://cafef.vn/home.rss
crawler.feeds[0].language=vi
crawler.feeds[0].maxArticles=20
crawler.feeds[1].name=VietnamNet
crawler.feeds[1].url=https://vietnamnet.vn/rss/kinh-doanh.rss
crawler.feeds[1].language=vi
crawler.feeds[1].maxArticles=20
