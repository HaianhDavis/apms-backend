spring.profiles.active=dev
spring.application.name=apms-backend

server.port=${PORT:8080}

spring.profiles.default=dev

# Email verification SMTP (backend only)
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${SMTP_FROM:}
app.mail.dev-fallback=${MAIL_DEV_FALLBACK:true}

# JWT
jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}

# Multipart file upload size limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# APMS Owner Organization Configuration
apms.owner.company-profile-id=${APMS_OWNER_COMPANY_PROFILE_ID:6a31a0000000000000000001}

# Firebase Cloud Messaging. Disabled by default so local development still starts without credentials.
app.firebase.enabled=${FIREBASE_ENABLED:false}
app.firebase.project-id=${FIREBASE_PROJECT_ID:}
app.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}

# Crawler Configuration
crawler.ai.provider=${AI_PROVIDER:gemini}
crawler.ai.gemini.api-key=${GEMINI_API_KEY:dummy-key}
crawler.ai.gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
crawler.ai.summary.enabled=${AI_SUMMARY_ENABLED:true}
crawler.ai.summary.auto-enabled=${AI_SUMMARY_AUTO_ENABLED:false}
crawler.ai.summary.max-articles-per-run=${AI_SUMMARY_MAX_PER_RUN:20}
crawler.schedule.enabled=${CRAWLER_ENABLED:true}
crawler.schedule.cron=${CRAWLER_CRON:0 */5 * * * *}
crawler.startup.enabled=${CRAWLER_STARTUP_ENABLED:true}
crawler.seed.enabled=${CRAWLER_SEED_ENABLED:true}
crawler.company-cache.ttl-seconds=${CACHE_TTL:300}
crawler.content.fetch-delay-ms=${FETCH_DELAY:1000}
crawler.content.max-length=${MAX_CONTENT_LENGTH:5000}
crawler.feeds[0].name=CafeF
crawler.feeds[0].url=https://cafef.vn/home.rss
crawler.feeds[0].language=vi
crawler.feeds[0].maxArticles=20
crawler.feeds[1].name=VietnamNet
crawler.feeds[1].url=https://vietnamnet.vn/rss/kinh-doanh.rss
crawler.feeds[1].language=vi
crawler.feeds[1].maxArticles=20
crawler.feeds[2].name=VnExpress
crawler.feeds[2].url=https://vnexpress.net/rss/kinh-doanh.rss
crawler.feeds[2].language=vi
crawler.feeds[2].maxArticles=20
crawler.feeds[3].name=TuoiTre
crawler.feeds[3].url=https://tuoitre.vn/rss/kinh-doanh.rss
crawler.feeds[3].language=vi
crawler.feeds[3].maxArticles=20
crawler.feeds[4].name=ThanhNien
crawler.feeds[4].url=https://thanhnien.vn/rss/tai-chinh-kinh-doanh.rss
crawler.feeds[4].language=vi
crawler.feeds[4].maxArticles=20
crawler.feeds[5].name=BaoDauTu
crawler.feeds[5].url=https://baodautu.vn/rss/doanh-nghiep.rss
crawler.feeds[5].language=vi
crawler.feeds[5].maxArticles=20

# News feature
apms.news.image.max-size-bytes=5242880

# Step-up Auth
jwt.step-up.secret=${JWT_STEP_UP_SECRET:}
apms.stepup.otp.pepper=${OTP_PEPPER:}
apms.stepup.token.expiration-seconds=600
apms.stepup.otp.expiration-seconds=300
apms.stepup.otp.max-attempts=5
apms.stepup.otp.resend-cooldown-seconds=60
apms.stepup.otp.max-challenges-per-15-minutes=5
