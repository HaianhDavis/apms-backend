spring.application.name=apms-backend

server.port=${PORT:18085}

spring.profiles.default=dev

# JWT
jwt.expirationMs=${JWT_EXPIRATION_MS}

# AI Provider
app.ai.provider=${AI_PROVIDER}
app.ai.gemini.model=${GEMINI_MODEL}

# Owner Organization
apms.owner.company-profile-id=${APMS_OWNER_COMPANY_PROFILE_ID}

# JPA
spring.jpa.open-in-view=false
# WebSocket
apms.websocket.allowed-origins=http://localhost:3000,http://localhost:5173

spring.data.web.pageable.max-page-size=100

# News feature
apms.news.image.max-size-bytes=5242880

# Step-up Auth
jwt.step-up.secret=${JWT_STEP_UP_SECRET:}
apms.stepup.otp.pepper=${OTP_PEPPER:}
apms.stepup.token.expiration-seconds=600
apms.stepup.otp.expiration-seconds=300
apms.stepup.otp.max-attempts=5
apms.stepup.otp.resend-cooldown-seconds=60
apms.stepup.otp.max-challenges-per-15-minutes=5
