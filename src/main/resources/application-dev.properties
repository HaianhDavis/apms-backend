# Server
server.port=8080

# SQL Server (JPA)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=apms;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=${SQL_SERVER_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/apms

# Neo4j
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=${NEO4J_PASSWORD}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expirationMs=900000

# File Upload
app.storage.upload-dir=uploads/

# Spring AI OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY:dummy-key}

# AI Provider Configuration
app.ai.provider=gemini
app.ai.gemini.api-key=${GEMINI_API_KEY:dummy-key}
app.ai.gemini.model=gemini-2.5-flash

# APMS Owner Organization Configuration
apms.owner.company-profile-id=${APMS_OWNER_COMPANY_PROFILE_ID:6a31a0000000000000000001}
