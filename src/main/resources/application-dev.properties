# Server
server.port=${SERVER_PORT:18085}

# Allow exception handling for unmapped paths (return 404 instead of whitelabel)
spring.mvc.throw-exception-if-no-handler-found=true
spring.resources.add-mappings=false

# SQL Server (JPA)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=apms;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=${SQL_SERVER_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/apms

# Neo4j
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=${NEO4J_PASSWORD}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expirationMs=900000

# File Upload
app.storage.upload-dir=uploads/
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Spring AI OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY:dummy-key}

# AI Provider Configuration
app.ai.provider=gemini
app.ai.gemini.api-key=${GEMINI_API_KEY:dummy-key}
app.ai.gemini.model=gemini-2.5-flash

# APMS Owner Organization Configuration
apms.owner.company-profile-id=${APMS_OWNER_COMPANY_PROFILE_ID:6a31a0000000000000000001}

# Spring Mail (Mock / Console logging for dev)
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=user
spring.mail.password=pass
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
