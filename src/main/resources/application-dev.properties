# =========================
# SQL Server
# =========================
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=apms;encrypt=true;trustServerCertificate=true}
spring.datasource.username=sa
spring.datasource.password=${SQL_SERVER_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# =========================
# HikariCP Connection Pool
# =========================
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Temporary debug: warn if a DB connection is held longer than 20 seconds
spring.datasource.hikari.leak-detection-threshold=20000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect


# =========================
# MongoDB
# =========================
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/apms?retryWrites=false}


# =========================
# Neo4j
# =========================
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=${NEO4J_PASSWORD}


# =========================
# JWT
# =========================
jwt.secret=${JWT_SECRET}


# =========================
# File Upload
# =========================
app.storage.upload-dir=${UPLOAD_DIR:uploads/}



# =========================
# AI
# =========================
spring.ai.openai.api-key=${OPENAI_API_KEY:dummy-key}

app.ai.gemini.api-keys=${GEMINI_API_KEYS:${GEMINI_API_KEY:}}
app.ai.gemini.api-key=${GEMINI_API_KEY:${GEMINI_API_KEYS:}}
app.ai.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
app.ai.gemini.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:32768}
gemini.retry.transient-attempts=${GEMINI_RETRY_TRANSIENT_ATTEMPTS:2}
app.ai.gemini.retry.transient-attempts=${GEMINI_RETRY_TRANSIENT_ATTEMPTS:2}
app.ai.gemini.retry.initial-delay-ms=${GEMINI_RETRY_INITIAL_DELAY_MS:5000}
app.ai.gemini.retry.max-delay-ms=${GEMINI_RETRY_MAX_DELAY_MS:15000}
app.ai.gemini.retry.jitter-ms=${GEMINI_RETRY_JITTER_MS:1000}
app.ai.gemini.retry.max-retry-after-ms=${GEMINI_RETRY_MAX_RETRY_AFTER_MS:120000}
app.ai.gemini.extraction.max-concurrent=${GEMINI_EXTRACTION_MAX_CONCURRENT:1}
app.ai.gemini.http.connect-timeout-ms=${GEMINI_HTTP_CONNECT_TIMEOUT_MS:15000}
app.ai.gemini.http.read-timeout-ms=${GEMINI_HTTP_READ_TIMEOUT_MS:180000}

# =========================
# TOTP Authentication
# =========================
security.totp.issuer=APMS
security.totp.digits=6
security.totp.period-seconds=30
security.totp.allowed-window=1
security.totp.enrollment-ttl-minutes=10
security.totp.max-failed-attempts=5
security.totp.lock-duration-minutes=10
security.totp.encryption-key=${TOTP_ENCRYPTION_KEY}

# =========================
# Step-Up Token
# =========================
jwt.step-up.secret=${JWT_SECRET}

