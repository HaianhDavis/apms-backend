# =========================
# SQL Server
# =========================
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=apms;encrypt=true;trustServerCertificate=true}
spring.datasource.username=sa
spring.datasource.password=${SQL_SERVER_PASSWORD:123456aA@$}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect


# =========================
# MongoDB
# =========================
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/apms?retryWrites=false}


# =========================
# Neo4j
# =========================
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=${NEO4J_PASSWORD}


# =========================
# JWT
# =========================
jwt.secret=${JWT_SECRET}


# =========================
# File Upload
# =========================
app.storage.upload-dir=${UPLOAD_DIR:uploads/}



# =========================
# AI
# =========================
spring.ai.openai.api-key=${OPENAI_API_KEY:dummy-key}

app.ai.gemini.api-key=${GEMINI_API_KEY}

# =========================
# TOTP Authentication
# =========================
security.totp.issuer=APMS
security.totp.digits=6
security.totp.period-seconds=30
security.totp.allowed-window=1
security.totp.enrollment-ttl-minutes=10
security.totp.max-failed-attempts=5
security.totp.lock-duration-minutes=10
security.totp.encryption-key=${TOTP_ENCRYPTION_KEY}

# =========================
# Step-Up Token
# =========================
jwt.step-up.secret=${JWT_SECRET}
