# =========================
# SQL Server
# =========================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false


# =========================
# MongoDB
# =========================
spring.data.mongodb.uri=${MONGO_URI}


# =========================
# Neo4j
# =========================
spring.neo4j.uri=${NEO4J_URI}
spring.neo4j.authentication.username=${NEO4J_USERNAME}
spring.neo4j.authentication.password=${NEO4J_PASSWORD}


# =========================
# JWT
# =========================
jwt.secret=${JWT_SECRET}


# =========================
# File Upload
# =========================
app.storage.upload-dir=${UPLOAD_DIR}


# =========================
# AI
# =========================

spring.ai.openai.api-key=${OPENAI_API_KEY:dummy-key}

app.ai.gemini.api-keys=${GEMINI_API_KEYS:${GEMINI_API_KEY:}}
app.ai.gemini.api-key=${GEMINI_API_KEY:${GEMINI_API_KEYS:}}
app.ai.gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
gemini.retry.transient-attempts=${GEMINI_RETRY_TRANSIENT_ATTEMPTS:2}
app.ai.gemini.retry.transient-attempts=${GEMINI_RETRY_TRANSIENT_ATTEMPTS:2}
app.ai.gemini.retry.initial-delay-ms=${GEMINI_RETRY_INITIAL_DELAY_MS:5000}
app.ai.gemini.retry.max-delay-ms=${GEMINI_RETRY_MAX_DELAY_MS:15000}
app.ai.gemini.retry.jitter-ms=${GEMINI_RETRY_JITTER_MS:1000}
app.ai.gemini.retry.max-retry-after-ms=${GEMINI_RETRY_MAX_RETRY_AFTER_MS:120000}
app.ai.gemini.extraction.max-concurrent=${GEMINI_EXTRACTION_MAX_CONCURRENT:1}
app.ai.gemini.http.connect-timeout-ms=${GEMINI_HTTP_CONNECT_TIMEOUT_MS:15000}
app.ai.gemini.http.read-timeout-ms=${GEMINI_HTTP_READ_TIMEOUT_MS:180000}


# =========================
# Email verification
# =========================

app.mail.dev-fallback=false


# =========================
# Reverse Proxy / Railway
# =========================
server.forward-headers-strategy=framework
server.port=${PORT:8080}
